services:
  postgres-db:
    image: postgres:16-alpine
    container_name: undoschool-postgres
    ports:
      - "5433:5432" # Safe isolated port mapping
    environment:
      POSTGRES_DB: undoschool_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - undoschool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d undoschool_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-service:
    build: .
    container_name: undoschool-booking-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/undoschool_booking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  undoschool_pgdata: